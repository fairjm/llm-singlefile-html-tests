<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>蟑螂模拟 | Cockroach Playground</title>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <!-- CDN: GSAP for smooth tweens -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <!-- CDN: gsap effects -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/EasePack.min.js"></script>

    <style>
      :root {
        --bg: #0f1115;
        --fg: #e6e6e6;
        --muted: #9aa4b2;
        --dust: #d2c1a1;
        --explosion: #ffdd55;
        --roach-body: #5b3a29;
        --roach-body-2: #6a4330;
        --roach-leg: #3b271b;
        --roach-eye: #111;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: radial-gradient(
            1200px 800px at 20% -10%,
            #1a1f2a 0%,
            rgba(26, 31, 42, 0) 60%
          ),
          radial-gradient(
            800px 600px at 120% 20%,
            #141923 0%,
            rgba(20, 25, 35, 0) 60%
          ),
          var(--bg);
        overflow: hidden;
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          PingFang SC, Microsoft Yahei, Helvetica Neue, Arial, Apple Color Emoji,
          Segoe UI Emoji;
      }
      .hud {
        position: fixed;
        left: 16px;
        top: 12px;
        z-index: 20;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(6px);
        border-radius: 10px;
        padding: 10px 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        user-select: none;
      }
      .hud h1 {
        margin: 0 0 6px;
        font-size: 14px;
        letter-spacing: 0.3px;
        color: #eaeef8;
      }
      .hud .tips {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      .hud .pill {
        display: inline-block;
        margin-top: 6px;
        padding: 3px 8px;
        font-size: 11px;
        color: #cdd6f4;
        border: 1px solid rgba(205, 214, 244, 0.2);
        border-radius: 999px;
        background: rgba(90, 104, 130, 0.12);
      }

      /* World layers */
      .world {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      .layer-shadows {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        filter: blur(4px) saturate(0.9);
        opacity: 0.6;
      }
      .layer-roaches {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }
      .layer-ui {
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
      }
      canvas.particles {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      /* Cockroach entity */
      .roach {
        position: absolute;
        width: 48px;
        height: 48px;
        transform-origin: 50% 50%;
        pointer-events: auto; /* we need clicks */
        cursor: pointer;
        /* subtle entrance */
        opacity: 0;
      }
      .roach .shadow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 36px;
        height: 14px;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.35),
          rgba(0, 0, 0, 0) 70%
        );
        transform: translate(-50%, -50%);
        filter: blur(2px);
        opacity: 0.7;
      }
      .roach .body {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 34px;
        transform: translate(-50%, -54%);
        border-radius: 60% 60% 55% 55% / 60% 60% 45% 45%;
        background: radial-gradient(
          50% 60% at 50% 35%,
          var(--roach-body-2),
          var(--roach-body)
        );
        box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.35),
          inset 0 6px 10px rgba(255, 255, 255, 0.06);
      }
      .roach .head {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 16px;
        transform: translate(-50%, -90%);
        border-radius: 50% 50% 35% 35%;
        background: linear-gradient(180deg, #3b2920, #2e2019);
        box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.05);
      }
      .roach .eye {
        position: absolute;
        width: 4px;
        height: 4px;
        background: var(--fg);
        border-radius: 50%;
        top: 2px;
        box-shadow: 0 0 0 1px var(--roach-eye) inset;
      }
      .roach .eye.left {
        left: 3px;
      }
      .roach .eye.right {
        right: 3px;
      }

      .roach .antenna {
        position: absolute;
        width: 2px;
        height: 16px;
        background: var(--roach-leg);
        top: -8px;
        left: 50%;
        transform-origin: 50% 100%;
        border-radius: 2px;
        opacity: 0.8;
      }
      .roach .antenna.a1 {
        transform: translateX(-7px) rotate(-25deg);
      }
      .roach .antenna.a2 {
        transform: translateX(5px) rotate(25deg);
      }

      /* Legs: three per side */
      .roach .legs {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 40px;
        height: 24px;
        transform: translate(-50%, -24%);
        pointer-events: none;
      }
      .roach .leg {
        position: absolute;
        width: 12px;
        height: 2px;
        background: var(--roach-leg);
        transform-origin: 0 50%;
        border-radius: 1px;
        opacity: 0.9;
      }
      /* left legs */
      .roach .leg.l1 {
        left: 4px;
        top: 2px;
        transform: rotate(-30deg);
      }
      .roach .leg.l2 {
        left: 2px;
        top: 10px;
        transform: rotate(-10deg);
      }
      .roach .leg.l3 {
        left: 6px;
        top: 18px;
        transform: rotate(10deg);
      }
      /* right legs */
      .roach .leg.r1 {
        right: 4px;
        top: 2px;
        transform: rotate(30deg);
      }
      .roach .leg.r2 {
        right: 2px;
        top: 10px;
        transform: rotate(10deg);
      }
      .roach .leg.r3 {
        right: 6px;
        top: 18px;
        transform: rotate(-10deg);
      }

      /* Idle wiggle keyframes for pause */
      @keyframes antenna-wiggle {
        0% {
          transform: translateX(-7px) rotate(-28deg);
        }
        50% {
          transform: translateX(-7px) rotate(-18deg);
        }
        100% {
          transform: translateX(-7px) rotate(-28deg);
        }
      }
      @keyframes antenna-wiggle2 {
        0% {
          transform: translateX(5px) rotate(28deg);
        }
        50% {
          transform: translateX(5px) rotate(18deg);
        }
        100% {
          transform: translateX(5px) rotate(28deg);
        }
      }
      @keyframes body-bob {
        0% {
          transform: translate(-50%, -54%) translateY(0);
        }
        50% {
          transform: translate(-50%, -54%) translateY(-1.2px);
        }
        100% {
          transform: translate(-50%, -54%) translateY(0);
        }
      }
      .idle .antenna.a1 {
        animation: antenna-wiggle 0.8s ease-in-out infinite;
      }
      .idle .antenna.a2 {
        animation: antenna-wiggle2 0.8s ease-in-out infinite;
      }
      .idle .body {
        animation: body-bob 0.9s ease-in-out infinite;
      }

      /* Speed lines while sprinting */
      .roach .speed-lines {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 60px;
        height: 2px;
        transform: translate(-110%, -50%) rotate(0deg);
        opacity: 0;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0.35),
          rgba(255, 255, 255, 0)
        );
        filter: blur(0.6px);
      }

      /* Click ripple feedback on body */
      .click-ripple {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 255, 255, 0.6);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      <h1>蟑螂模拟器</h1>
      <div class="tips">
        <p>由horizon-alpha制作</p>
        - 随机生成并在屏幕内移动/暂停/转向（头部朝向与实际移动方向一致）<br />
        - 第一次点击：加速逃跑（带尘土/速度线）<br />
        - 第二次点击：爆炸并消失（粒子特效）<br />
      </div>
      <div class="pill">
        参数示例：?n=20&speed=50-100&escape=2-3（默认
        speed=40-80，escape=1.8-2.6）
      </div>
    </div>

    <div class="world" id="world">
      <div class="layer-shadows" id="layerShadows"></div>
      <div class="layer-roaches" id="layerRoaches"></div>
      <canvas class="particles" id="particles"></canvas>
      <div class="layer-ui" id="layerUI"></div>
    </div>

    <script>
      // Utility random helpers
      const rand = (min, max) => Math.random() * (max - min) + min;
      const randInt = (min, max) => Math.floor(rand(min, max + 1));
      const choice = (arr) => arr[(Math.random() * arr.length) | 0];
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const now = () => performance.now();

      // World refs
      const world = document.getElementById("world");
      const roachLayer = document.getElementById("layerRoaches");
      const particlesCanvas = document.getElementById("particles");
      const ctx = particlesCanvas.getContext("2d");

      let vw = window.innerWidth;
      let vh = window.innerHeight;
      const boundsPadding = 24; // keep roaches in view with some padding

      function resize() {
        vw = window.innerWidth;
        vh = window.innerHeight;
        particlesCanvas.width = vw;
        particlesCanvas.height = vh;
      }
      window.addEventListener("resize", resize);
      resize();

      // Particle system (dust and explosion)
      const particles = [];
      function spawnDust(x, y, dirRad) {
        // small burst of dust when starting/turning/accelerating
        const count = randInt(4, 8);
        for (let i = 0; i < count; i++) {
          const speed = rand(30, 80);
          const ang = dirRad + rand(-0.8, 0.8) + Math.PI; // behind the roach
          particles.push({
            type: "dust",
            x,
            y,
            vx: Math.cos(ang) * speed,
            vy: Math.sin(ang) * speed,
            life: rand(220, 420),
            t: 0,
            size: rand(1.5, 3.5),
            color: "rgba(210,193,161,",
          });
        }
      }
      function spawnExplosion(x, y) {
        // bright explosion with chunks and glow
        const count = randInt(24, 36);
        for (let i = 0; i < count; i++) {
          const speed = rand(80, 220);
          const ang = rand(0, Math.PI * 2);
          particles.push({
            type: "frag",
            x,
            y,
            vx: Math.cos(ang) * speed,
            vy: Math.sin(ang) * speed - rand(0, 60),
            life: rand(380, 680),
            t: 0,
            size: rand(2, 4.5),
            color: "rgba(255,221,85,",
          });
        }
        // shockwave circle
        particles.push({
          type: "ring",
          x,
          y,
          vx: 0,
          vy: 0,
          life: 420,
          t: 0,
          size: 8,
          color: "rgba(255,240,160,",
        });
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.t += dt;
          const k = p.t / p.life;
          if (k >= 1) {
            particles.splice(i, 1);
            continue;
          }
          if (p.type === "ring") {
            // expand and fade
            p.size = 8 + k * 60;
          } else {
            // gravity and drag
            p.vy += 200 * (dt / 1000);
            p.vx *= 1 - 0.7 * (dt / 1000);
            p.vy *= 1 - 0.7 * (dt / 1000);
            p.x += p.vx * (dt / 1000);
            p.y += p.vy * (dt / 1000);
          }
        }
      }

      function renderParticles() {
        ctx.clearRect(0, 0, vw, vh);
        for (const p of particles) {
          const k = p.t / p.life;
          const alpha = (1 - k) * (p.type === "dust" ? 0.7 : 0.9);
          if (p.type === "ring") {
            ctx.beginPath();
            ctx.strokeStyle = p.color + alpha * 0.6 + ")";
            ctx.lineWidth = 2;
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.fillStyle = p.color + alpha + ")";
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Roach AI
      class Roach {
        constructor(index) {
          this.index = index;
          this.el = this.createEl();
          this.x = rand(boundsPadding, vw - boundsPadding);
          this.y = rand(boundsPadding, vh - boundsPadding);
          // Make 0 rad point up so the head faces movement direction naturally
          this.dir = rand(0, Math.PI * 2); // radians, 0 = facing up after rotation offset
          // Read speed configuration from URL params (supports range "min-max" or single value)
          const spParam = new URLSearchParams(location.search).get("speed");
          const parseRange = (val, defMin, defMax) => {
            if (!val) return [defMin, defMax];
            const m = String(val).split("-");
            if (m.length === 2) {
              const a = parseFloat(m[0]);
              const b = parseFloat(m[1]);
              if (isFinite(a) && isFinite(b) && b >= a) return [a, b];
            }
            const s = parseFloat(val);
            if (isFinite(s)) return [s, s];
            return [defMin, defMax];
          };
          const [minBase, maxBase] = parseRange(spParam, 40, 80);
          this.speed = rand(minBase, maxBase); // px/s
          this.baseSpeed = this.speed;

          // Escape speed multiplier config
          const escParam = new URLSearchParams(location.search).get("escape");
          let escMin = 1.8,
            escMax = 2.6;
          if (escParam) {
            const [eMin, eMax] = parseRange(escParam, 1.8, 2.6);
            escMin = eMin;
            escMax = eMax;
          }
          this.escapeMin = escMin;
          this.escapeMax = escMax;

          this.maxSpeed = this.baseSpeed * 3.2;
          this.state = "move"; // move | pause | scared | dying
          this.stateUntil = now() + rand(800, 2000);
          this.clicks = 0;
          this.lastTurnAt = now();
          this.turnCooldown = rand(400, 1200);
          this.width = 48;
          this.height = 48;

          // entrance
          gsap.to(this.el, { opacity: 1, duration: 0.5, ease: "power2.out" });

          this.applyTransform(true);
        }
        createEl() {
          const el = document.createElement("div");
          el.className = "roach idle";
          el.innerHTML = `
          <div class="shadow"></div>
          <div class="legs">
            <div class="leg l1"></div>
            <div class="leg l2"></div>
            <div class="leg l3"></div>
            <div class="leg r1"></div>
            <div class="leg r2"></div>
            <div class="leg r3"></div>
          </div>
          <div class="body"></div>
          <div class="head">
            <div class="eye left"></div>
            <div class="eye right"></div>
          </div>
          <div class="antenna a1"></div>
          <div class="antenna a2"></div>
          <div class="speed-lines"></div>
          <div class="click-ripple"></div>
        `;
          roachLayer.appendChild(el);
          // click interaction
          el.addEventListener("click", (e) => {
            e.stopPropagation();
            this.onClick(e);
          });
          return el;
        }
        onClick(e) {
          this.clicks++;
          // visual ripple
          const r = this.el.querySelector(".click-ripple");
          gsap.killTweensOf(r);
          gsap.set(r, {
            opacity: 1,
            scale: 0.4,
            borderColor: "rgba(255,255,255,0.8)",
          });
          gsap.to(r, {
            scale: 2.6,
            opacity: 0,
            duration: 0.5,
            ease: "power2.out",
          });

          if (this.clicks === 1 && this.state !== "dying") {
            // Speed up and scared
            this.enterScared();
            spawnDust(this.x, this.y, this.dir);
          } else if (this.clicks >= 2 && this.state !== "dying") {
            // explode
            this.explode();
          }
        }
        enterScared() {
          this.state = "scared";
          this.stateUntil = now() + rand(1200, 2000);
          // Increase speed using configurable escape multiplier range
          this.speed = clamp(
            this.speed * rand(this.escapeMin, this.escapeMax),
            this.baseSpeed,
            this.maxSpeed
          );
          this.lastTurnAt = now();
          this.turnCooldown = rand(120, 260);

          // show speed lines briefly
          const sl = this.el.querySelector(".speed-lines");
          gsap.killTweensOf(sl);
          gsap.set(sl, { opacity: 0.0 });
          gsap.to(sl, { opacity: 0.9, duration: 0.08, ease: "power2.out" });
          gsap.to(sl, {
            opacity: 0,
            duration: 0.5,
            ease: "power2.out",
            delay: 0.15,
          });

          // shake body a bit
          gsap.fromTo(
            this.el,
            { x: this.x, y: this.y },
            {
              x: this.x,
              y: this.y,
              duration: 0.25,
              ease: "rough({ strength: 1, points: 8, template: power2.inOut, taper: none, randomize: true, clamp: true})",
            }
          );
        }
        explode() {
          this.state = "dying";
          // freeze position and animate scale/opacity out
          const cx = this.x,
            cy = this.y;
          spawnExplosion(cx, cy);
          gsap.to(this.el, {
            duration: 0.35,
            scale: 1.6,
            rotate: (this.dir * 180) / Math.PI + 40 + 90, // keep visual rotation consistent with head-forward orientation
            opacity: 0,
            ease: "back.in(1.6)",
            onComplete: () => {
              this.el.remove();
              this.dead = true;
            },
          });
        }
        setState(newState, durMin = 500, durMax = 1500) {
          this.state = newState;
          this.stateUntil = now() + rand(durMin, durMax);
          if (this.state === "pause") {
            this.el.classList.add("idle");
            // slow down gradually
            this.speed = lerp(this.speed, this.baseSpeed * 0.6, 0.6);
            spawnDust(this.x, this.y, this.dir);
          } else {
            this.el.classList.remove("idle");
          }
          if (this.state === "move") {
            // small chance to burst start
            if (Math.random() < 0.25) {
              spawnDust(this.x, this.y, this.dir);
              this.speed = clamp(
                this.baseSpeed * rand(1.0, 1.6),
                this.baseSpeed * 0.8,
                this.maxSpeed * 0.7
              );
            } else {
              this.speed = clamp(
                this.baseSpeed * rand(0.8, 1.2),
                this.baseSpeed * 0.6,
                this.maxSpeed * 0.6
              );
            }
          }
        }
        randomTurn(intensity = 1) {
          const delta = rand(-0.9, 0.9) * intensity;
          this.dir += delta;
          spawnDust(this.x, this.y, this.dir);
        }
        bounceAtEdges() {
          let bounced = false;
          if (this.x < boundsPadding) {
            this.x = boundsPadding;
            this.dir = Math.PI - this.dir;
            bounced = true;
          }
          if (this.x > vw - boundsPadding) {
            this.x = vw - boundsPadding;
            this.dir = Math.PI - this.dir;
            bounced = true;
          }
          if (this.y < boundsPadding) {
            this.y = boundsPadding;
            this.dir = -this.dir;
            bounced = true;
          }
          if (this.y > vh - boundsPadding) {
            this.y = vh - boundsPadding;
            this.dir = -this.dir;
            bounced = true;
          }
          if (bounced) {
            spawnDust(this.x, this.y, this.dir);
            // slight rotate normalization
            this.dir += rand(-0.2, 0.2);
          }
        }
        applyTransform(initial = false) {
          const deg = (this.dir * 180) / Math.PI;
          // Correct facing so the HEAD leads (previous -90 made tail lead); +90 aligns head-forward
          const t = `translate(${this.x - this.width / 2}px, ${
            this.y - this.height / 2
          }px) rotate(${deg + 90}deg)`;
          if (initial) {
            this.el.style.transform = t;
          } else {
            // direct set is fine; GSAP used for micro fx only
            this.el.style.transform = t;
          }
        }
        update(dt) {
          if (this.dead) return;

          // state transitions
          if (now() >= this.stateUntil) {
            // roll next state depending on current
            if (this.state === "pause") {
              this.setState(Math.random() < 0.8 ? "move" : "pause", 900, 1600);
            } else if (this.state === "scared") {
              // back to move or pause
              this.setState(Math.random() < 0.7 ? "move" : "pause", 800, 1500);
              // normalize speed towards base
              this.speed = lerp(
                this.speed,
                this.baseSpeed * rand(0.9, 1.2),
                0.4
              );
            } else {
              // moving - can pause sometimes
              this.setState(Math.random() < 0.35 ? "pause" : "move", 700, 1600);
            }
          }

          // occasional turning
          if (now() - this.lastTurnAt >= this.turnCooldown) {
            const inten = this.state === "scared" ? 0.6 : 0.35;
            this.randomTurn(inten);
            this.lastTurnAt = now();
            this.turnCooldown =
              this.state === "scared" ? rand(90, 210) : rand(400, 1200);
          }

          // movement
          if (this.state === "move" || this.state === "scared") {
            const speed = this.speed * (dt / 1000);
            this.x += Math.cos(this.dir) * speed;
            this.y += Math.sin(this.dir) * speed;
            this.bounceAtEdges();
          }

          this.applyTransform();
        }
      }

      // Spawn N roaches
      const urlN = new URLSearchParams(location.search).get("n");
      const NUM = clamp(parseInt(urlN || "", 10) || 10, 1, 80);
      const roaches = [];
      for (let i = 0; i < NUM; i++) {
        roaches.push(new Roach(i));
      }

      // World interaction: click on empty space causes nearest roach to get scared
      world.addEventListener("click", (e) => {
        if (e.target.closest(".roach")) return; // handled by roach
        const mx = e.clientX,
          my = e.clientY;
        // find nearest
        let best = null,
          bestD = 1e9;
        for (const r of roaches) {
          if (r.dead) continue;
          const dx = r.x - mx,
            dy = r.y - my;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestD) {
            bestD = d2;
            best = r;
          }
        }
        if (best) {
          // turn away from click and scare
          const angToMouse = Math.atan2(my - best.y, mx - best.x);
          // reverse direction somewhat
          best.dir = angToMouse + Math.PI + rand(-0.35, 0.35);
          best.enterScared();
          spawnDust(best.x, best.y, best.dir);
        }
      });

      // RAF loop
      let last = now();
      function loop() {
        const t = now();
        let dt = t - last;
        if (dt > 80) dt = 80; // clamp to avoid jump
        last = t;

        for (const r of roaches) r.update(dt);
        updateParticles(dt);
        renderParticles();

        requestAnimationFrame(loop);
      }
      loop();

      // Subtle ambient parallax shadows (decorative gradient)
      // We programmatically draw a radial gradient background for layerShadows using CSS.
      // For simplicity, re-assign on resize based on viewport.
      function refreshShadowLayer() {
        const ls = document.getElementById("layerShadows");
        const gx = Math.round(vw * 0.2),
          gy = Math.round(vh * 0.12);
        const gx2 = Math.round(vw * 0.75),
          gy2 = Math.round(vh * 0.85);
        ls.style.background = `
        radial-gradient(${Math.round(vw * 0.8)}px ${Math.round(
          vh * 0.6
        )}px at ${gx}px ${gy}px, rgba(0,0,0,0.45), rgba(0,0,0,0) 65%),
        radial-gradient(${Math.round(vw * 0.5)}px ${Math.round(
          vh * 0.35
        )}px at ${gx2}px ${gy2}px, rgba(0,0,0,0.35), rgba(0,0,0,0) 65%)
      `;
      }
      refreshShadowLayer();
      window.addEventListener("resize", refreshShadowLayer);
    </script>
  </body>
</html>
