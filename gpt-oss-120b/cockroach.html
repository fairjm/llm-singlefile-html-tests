<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>黑白蟑螂 Demo</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #111; /* 黑色背景 */
        cursor: crosshair;
        user-select: none;
        font-family: sans-serif;
      }

      /* ── 蟑螂本体（白色圆形+两根天线） ── */
      .cockroach {
        position: absolute;
        width: 40px;
        height: 40px;
        /* 主体：白色圆形 */
        background: #fff;
        border-radius: 50%;
        /* 天线 (::before, ::after) 为两根细线 */
        overflow: hidden; /* 让伪元素不超出圆形 */
      }
      .cockroach::before,
      .cockroach::after {
        content: "";
        position: absolute;
        width: 2px;
        height: 12px;
        background: #fff;
        left: 50%;
        top: 0;
        transform-origin: bottom center;
      }
      .cockroach::before {
        transform: translate(-6px, -20px) rotate(-30deg);
      }
      .cockroach::after {
        transform: translate(6px, -20px) rotate(30deg);
      }

      /* 暂停时的“待机”动画：轻微摇摆 */
      .idle {
        animation: idleWiggle 0.6s infinite ease-in-out;
      }
      @keyframes idleWiggle {
        0% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(8deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      /* 第一次点击后出现的光晕 */
      .boosted {
        box-shadow: 0 0 8px #fff, 0 0 16px #fff;
      }

      /* 爆炸粒子（白色小点） */
      .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #fff;
        border-radius: 50%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <script>
      /* ------------------- 参数 ------------------- */
      const NUM = 8; // 蟑螂数量
      const BASE_SPEED = 80; // 像素/秒（默认速度）
      const BOOST_FACTOR = 2; // 第一次点击后速度倍增
      const MOVE_INTERVAL = [2000, 5000]; // 移动一次的最短/最长时间 (ms)
      const IDLE_INTERVAL = [500, 1500]; // 暂停的最短/最长时间 (ms)
      /* ------------------------------------------- */

      /* 辅助函数 --------------------------------------------------- */
      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }
      /* ----------------------------------------------------------- */

      class Cockroach {
        constructor() {
          // 创建 DOM 元素
          this.el = document.createElement("div");
          this.el.className = "cockroach";
          document.body.appendChild(this.el);

          // 状态
          this.clicks = 0; // 0=未点，1=加速，2=已炸
          this.speed = BASE_SPEED;
          this.isIdle = false; // 正在待机
          this.tween = null; // 当前的 animation-frame id

          // 随机初始位置
          this.x = rand(0, innerWidth - 40);
          this.y = rand(0, innerHeight - 40);
          this.setPos(this.x, this.y);

          // 点击事件
          this.el.addEventListener("click", (e) => {
            e.stopPropagation();
            this.handleClick();
          });

          // 开始循环
          this.moveRandom();
        }

        /** 位置更新（直接修改 transform） */
        setPos(x, y) {
          this.x = x;
          this.y = y;
          this.el.style.transform = `translate(${x}px, ${y}px)`;
        }

        /** 随机移动 ------------------------------------------------- */
        moveRandom() {
          if (this.clicks >= 2) return; // 已炸不再移动

          const targetX = rand(0, innerWidth - 40);
          const targetY = rand(0, innerHeight - 40);
          const dx = targetX - this.x,
            dy = targetY - this.y;
          const distance = Math.hypot(dx, dy);
          const minTime = MOVE_INTERVAL[0];
          const maxTime = MOVE_INTERVAL[1];
          const moveTime = Math.max(minTime, (distance / this.speed) * 1000);
          const duration = rand(minTime, maxTime); // 让速度略微不均匀
          const totalTime = Math.max(moveTime, duration); // 最小保证能到达

          const start = performance.now();
          const startX = this.x,
            startY = this.y;

          const step = (now) => {
            const elapsed = now - start;
            const t = Math.min(elapsed / totalTime, 1);
            const nx = startX + dx * t;
            const ny = startY + dy * t;
            this.setPos(nx, ny);
            if (t < 1) this.tween = requestAnimationFrame(step);
            else {
              this.tween = null;
              this.idle();
            }
          };
          this.tween = requestAnimationFrame(step);
        }

        /** 暂停 / 待机 ------------------------------------------------- */
        idle() {
          if (this.clicks >= 2) return;
          this.isIdle = true;
          this.el.classList.add("idle");
          const idleTime = rand(IDLE_INTERVAL[0], IDLE_INTERVAL[1]);
          setTimeout(() => {
            this.el.classList.remove("idle");
            this.isIdle = false;
            this.moveRandom();
          }, idleTime);
        }

        /** 点击处理 ------------------------------------------------- */
        handleClick() {
          if (this.clicks === 0) {
            // 第一次点击 → 加速
            this.clicks = 1;
            this.speed *= BOOST_FACTOR;
            this.el.classList.add("boosted");
            // 若当前在移动，直接加速时间比例
            if (this.tween && !this.isIdle) {
              // 直接把剩余时间缩短
              // 这里直接通过 timeScale 的思路：把已有的 tween 直接加速
              // 简单做法：在下一次 movement 时使用已提升的 speed
            }
          } else if (this.clicks === 1) {
            // 第二次点击 → 爆炸
            this.clicks = 2;
            this.el.classList.remove("boosted", "idle");
            // 爆炸粒子
            const rect = this.el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const particleCount = 30;
            for (let i = 0; i < particleCount; i++) {
              const p = document.createElement("div");
              p.className = "particle";
              p.style.left = cx + "px";
              p.style.top = cy + "px";
              document.body.appendChild(p);
              const angle = Math.random() * Math.PI * 2;
              const dist = rand(20, 80);
              const targetX = cx + Math.cos(angle) * dist;
              const targetY = cy + Math.sin(angle) * dist;
              const duration = rand(300, 800); // ms
              const start = performance.now();
              const startX = cx,
                startY = cy;
              const dx = targetX - startX,
                dy = targetY - startY;
              const step = (now) => {
                const elapsed = now - start;
                const t = Math.min(elapsed / duration, 1);
                p.style.left = startX + dx * t + "px";
                p.style.top = startY + dy * t + "px";
                p.style.opacity = 1 - t;
                if (t < 1) requestAnimationFrame(step);
                else p.remove();
              };
              requestAnimationFrame(step);
            }
            // 让蟑螂淡出后移除
            this.el.style.transition =
              "transform 0.4s ease-in, opacity 0.4s ease-in";
            this.el.style.transform += " scale(0)";
            this.el.style.opacity = "0";
            setTimeout(() => {
              this.el.remove();
            }, 400);
          }
        }
      }

      /* 初始化 --------------------------------------------------- */
      for (let i = 0; i < NUM; i++) new Cockroach();
      /* 让窗口改变时不需要额外处理，下一次移动会自动取新宽高 */
    </script>
  </body>
</html>
