<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>随机迷宫生成 + 寻路可视化</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f8f9fa;
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
      }
      #canvasContainer {
        text-align: center;
        margin: 20px auto;
      }
      canvas {
        background: #fff;
        border: 1px solid #333;
      }

      .btn-group {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2 class="text-center">随机迷宫生成 + 寻路可视化</h2>

    <div id="canvasContainer">
      <canvas id="mazeCanvas" width="520" height="520"></canvas>
    </div>

    <div class="d-flex justify-content-center">
      <div class="btn-group me-2">
        <button id="resetBtn" class="btn btn-primary">重置</button>
      </div>
      <div class="btn-group me-2">
        <button id="dfsBtn" class="btn btn-success">DFS 寻路</button>
        <button id="bfsBtn" class="btn btn-warning">BFS 寻路</button>
        <button id="astarBtn" class="btn btn-info">A* 寻路</button>
      </div>
    </div>

    <!-- lodash 用于深拷贝，简化实现 -->
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    <script>
      /* ---------- 参数 ----------
   COLS·ROWS : 迷宫格子数（正方形迷宫）
   CELL_SIZE : 每个格子的像素大小（实际绘制时会留 1px 的线宽空隙）
  --------------------------------*/

      const COLS = 20,
        ROWS = 20;
      const CELL_SIZE = 25; // 像素

      const canvas = document.getElementById("mazeCanvas");
      const ctx = canvas.getContext("2d");

      /* ---------- 迷宫数据结构 ----------
   cell = { top:true, right:true, bottom:true, left:true, visited:false }
   walls 为 true 表示仍然存在，搜索只能穿过没有墙的一侧
*/
      let maze = []; // 2d array[ROWS][COLS]

      // 生成完美迷宫（递归回溯 / 随机深度优先搜索）
      function generateMaze() {
        // 初始化每个格子都有四壁
        maze = new Array(ROWS);
        for (let r = 0; r < ROWS; r++) {
          maze[r] = new Array(COLS);
          for (let c = 0; c < COLS; c++) {
            maze[r][c] = {
              top: true,
              right: true,
              bottom: true,
              left: true,
              visited: false,
            };
          }
        }

        const stack = [{ r: 0, c: 0 }];
        maze[0][0].visited = true;

        const drc = [
          { dr: -1, dc: 0, wall: "top", opp: "bottom" }, // up
          { dr: 0, dc: 1, wall: "right", opp: "left" }, // right
          { dr: 1, dc: 0, wall: "bottom", opp: "top" }, // down
          { dr: 0, dc: -1, wall: "left", opp: "right" }, // left
        ];

        while (stack.length) {
          const cur = stack[stack.length - 1];
          const { r, c } = cur;
          // 随机挑选未访问的邻居
          const neigh = _.shuffle(
            drc.filter((d) => {
              const nr = r + d.dr,
                nc = c + d.dc;
              return (
                nr >= 0 &&
                nr < ROWS &&
                nc >= 0 &&
                nc < COLS &&
                !maze[nr][nc].visited
              );
            })
          );
          if (neigh.length === 0) {
            // 没有未访问邻居，回溯
            stack.pop();
            continue;
          }
          // 取第一个未访问邻居，打通墙并入栈
          const dir = neigh[0];
          const nr = r + dir.dr,
            nc = c + dir.dc;
          maze[r][c][dir.wall] = false; // 打通当前格子到邻居的墙
          maze[nr][nc][dir.opp] = false; // 同时邻居相应方向的墙也打开
          maze[nr][nc].visited = true;
          stack.push({ r: nr, c: nc });
        }
      }

      /* ---------- 绘制迷宫 ----------
   使用 canvas 绘制每格四条线，墙为黑色，通路白色
*/
      function drawMaze() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#333";

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const x = c * CELL_SIZE;
            const y = r * CELL_SIZE;
            const cell = maze[r][c];
            // top
            if (cell.top) {
              ctx.beginPath();
              ctx.moveTo(x, y);
              ctx.lineTo(x + CELL_SIZE, y);
              ctx.stroke();
            }
            // right
            if (cell.right) {
              ctx.beginPath();
              ctx.moveTo(x + CELL_SIZE, y);
              ctx.lineTo(x + CELL_SIZE, y + CELL_SIZE);
              ctx.stroke();
            }
            // bottom
            if (cell.bottom) {
              ctx.beginPath();
              ctx.moveTo(x + CELL_SIZE, y + CELL_SIZE);
              ctx.lineTo(x, y + CELL_SIZE);
              ctx.stroke();
            }
            // left
            if (cell.left) {
              ctx.beginPath();
              ctx.moveTo(x, y + CELL_SIZE);
              ctx.lineTo(x, y);
              ctx.stroke();
            }
          }
        }
        // 标记起点 (0,0) 与终点 (ROWS-1, COLS-1)
        ctx.fillStyle = "rgba(0,200,0,0.4)";
        ctx.fillRect(0, 0, CELL_SIZE, CELL_SIZE);
        ctx.fillStyle = "rgba(200,0,0,0.4)";
        ctx.fillRect(
          (COLS - 1) * CELL_SIZE,
          (ROWS - 1) * CELL_SIZE,
          CELL_SIZE,
          CELL_SIZE
        );
      }

      /* ---------- 通用搜索工具 ----------
   把迷宫中的格子当作图的节点，若两格之间的墙被拆除则存在连通边
   返回一条从 start 到 goal 的路径（若不存在则返回 []）
*/
      function findPath(searchFn) {
        // 搜索时需要知道每个格子可以走向哪些邻居
        function neighbors(r, c) {
          const dirs = [];
          if (!maze[r][c].top && r > 0) dirs.push({ r: r - 1, c: c }); // up
          if (!maze[r][c].right && c < COLS - 1) dirs.push({ r: r, c: c + 1 }); // right
          if (!maze[r][c].bottom && r < ROWS - 1) dirs.push({ r: r + 1, c: c }); // down
          if (!maze[r][c].left && c > 0) dirs.push({ r: r, c: c - 1 }); // left
          return dirs;
        }

        const start = { r: 0, c: 0 };
        const goal = { r: ROWS - 1, c: COLS - 1 };

        // 统一的搜索实现，利用传入的搜索函数结构
        return searchFn(start, goal, neighbors);
      }

      /* ---------- 实际三种搜索算法 ----------
   每个函数都会返回完整的路径（数组 of {r,c}），若找不到则返回 [].
   为了演示，将搜索的每一步都记录下来（visitedOrder），随后用于动画。
*/

      function dfsSearch(start, goal, neighborFn) {
        const stack = [{ pos: start, path: [start] }];
        const visited = new Set();
        visited.add(`${start.r},${start.c}`);
        const visitedOrder = [];

        while (stack.length) {
          const { pos, path } = stack.pop();
          visitedOrder.push(pos);
          if (pos.r === goal.r && pos.c === goal.c) {
            animatePath(path, visitedOrder);
            return path;
          }
          for (const nb of neighborFn(pos.r, pos.c)) {
            const key = `${nb.r},${nb.c}`;
            if (!visited.has(key)) {
              visited.add(key);
              stack.push({ pos: nb, path: [...path, nb] });
            }
          }
        }
        animatePath([], visitedOrder);
        return [];
      }

      function bfsSearch(start, goal, neighborFn) {
        const queue = [{ pos: start, path: [start] }];
        const visited = new Set([`${start.r},${start.c}`]);
        const visitedOrder = [];

        while (queue.length) {
          const { pos, path } = queue.shift();
          visitedOrder.push(pos);
          if (pos.r === goal.r && pos.c === goal.c) {
            animatePath(path, visitedOrder);
            return path;
          }
          for (const nb of neighborFn(pos.r, pos.c)) {
            const key = `${nb.r},${nb.c}`;
            if (!visited.has(key)) {
              visited.add(key);
              queue.push({ pos: nb, path: [...path, nb] });
            }
          }
        }
        animatePath([], visitedOrder);
        return [];
      }

      function aStarSearch(start, goal, neighborFn) {
        // 使用最小堆的简易实现（这里直接用数组 + 排序, 迷宫规模不大）
        const openSet = [
          { pos: start, g: 0, f: heuristic(start, goal), path: [start] },
        ];
        const closed = new Set();
        const visitedOrder = [];

        function heuristic(a, b) {
          return Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
        }

        while (openSet.length) {
          // 取 f 最小的节点
          openSet.sort((x, y) => x.f - y.f);
          const current = openSet.shift();
          const { pos, g, path } = current;
          visitedOrder.push(pos);
          if (pos.r === goal.r && pos.c === goal.c) {
            animatePath(path, visitedOrder);
            return path;
          }
          closed.add(`${pos.r},${pos.c}`);

          for (const nb of neighborFn(pos.r, pos.c)) {
            const nbKey = `${nb.r},${nb.c}`;
            if (closed.has(nbKey)) continue;
            const gScore = g + 1;
            const fScore = gScore + heuristic(nb, goal);
            openSet.push({
              pos: nb,
              g: gScore,
              f: fScore,
              path: [...path, nb],
            });
          }
        }
        animatePath([], visitedOrder);
        return [];
      }

      /* ---------- 动画 ----------
   `path` 为最终成功路径（若为空则没有找到），
   `visitedOrder` 为搜索时遍历的节点顺序。
   - 首先用淡黄色标记搜索过程中遍历过的格子；
   - 再用一个蓝色圆圈按顺序走完 `path`（若 `path` 为 [] 则只显示遍历过程）。
*/
      let animInterval = null;
      function animatePath(path, visitedOrder) {
        // 清除已有动画
        if (animInterval) clearInterval(animInterval);
        // 先绘制整个迷宫
        drawMaze();

        // 1) 用淡黄色标记搜索的遍历顺序
        visitedOrder.forEach((cell, i) => {
          setTimeout(() => {
            ctx.fillStyle = "rgba(255,255,0,0.3)";
            ctx.fillRect(
              cell.c * CELL_SIZE,
              cell.r * CELL_SIZE,
              CELL_SIZE,
              CELL_SIZE
            );
          }, i * 15);
        });

        // 2) 若找到路径，则随后让蓝色圆圈沿路径前进
        if (path.length) {
          const startDelay = visitedOrder.length * 15;
          setTimeout(() => {
            let idx = 0;
            animInterval = setInterval(() => {
              if (idx >= path.length) {
                clearInterval(animInterval);
                return;
              }
              // 抹掉前一个圆圈（重新绘制格子背景）
              const prev = path[idx - 1];
              if (prev) {
                ctx.clearRect(
                  prev.c * CELL_SIZE,
                  prev.r * CELL_SIZE,
                  CELL_SIZE,
                  CELL_SIZE
                );
                drawMaze(); // 重新绘制墙（代价小，保证不留下残影）
              }
              // 绘制圆圈
              const cur = path[idx];
              const cx = cur.c * CELL_SIZE + CELL_SIZE / 2;
              const cy = cur.r * CELL_SIZE + CELL_SIZE / 2;
              ctx.beginPath();
              ctx.arc(cx, cy, CELL_SIZE / 3, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(0,0,255,0.7)";
              ctx.fill();

              idx++;
            }, 70);
          }, startDelay);
        }
      }

      /* ---------- UI 绑定 ----------
       * resetBtn   – 重新生成迷宫并绘制
       * dfsBtn    – 使用深度优先搜索展示过程
       * bfsBtn    – 使用广度优先搜索展示过程
       * astarBtn  – 使用 A* 搜索展示过程
       */
      document.getElementById("resetBtn").addEventListener("click", () => {
        generateMaze();
        drawMaze();
      });

      document.getElementById("dfsBtn").addEventListener("click", () => {
        findPath(dfsSearch);
      });

      document.getElementById("bfsBtn").addEventListener("click", () => {
        findPath(bfsSearch);
      });

      document.getElementById("astarBtn").addEventListener("click", () => {
        findPath(aStarSearch);
      });

      /* ---------- 初始化 ----------
   页面加载后立即生成一个迷宫
*/
      generateMaze();
      drawMaze();
    </script>
  </body>
</html>
